<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم الأدمن</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #121212; color: #fff; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid red; }
        ul { list-style: none; padding: 0; }
        li { background: #2a2a2a; margin: 5px 0; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        button { background: #dc3545; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>لوحة تحكم المسؤول (Admin Panel)</h2>
    <h3>الأجهزة التي فتحت التطبيق (IPs):</h3>
    <ul id="ipList">جاري التحميل...</ul>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEAukk7GrRJDBC54gAjyuC9YMEMvP3E",
        authDomain: "chat-app-95202.firebaseapp.com",
        databaseURL: "https://chat-app-95202-default-rtdb.firebaseio.com",
        projectId: "chat-app-95202",
        storageBucket: "chat-app-95202.firebasestorage.app",
        messagingSenderId: "714604280805",
        appId: "1:714604280805:web:84fbc15d964d68bf954d0c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const ipListRef = ref(db, 'connected_users');
    onValue(ipListRef, (snapshot) => {
        const list = document.getElementById('ipList');
        list.innerHTML = '';
        const data = snapshot.val();
        if (data) {
            Object.keys(data).forEach(key => {
                const user = data[key];
                list.innerHTML += `<li><span>IP: ${user.ip}</span> <button onclick="blockIp('${key}')">حظر</button></li>`;
            });
        } else {
            list.innerHTML = '<li>لا توجد أجهزة مسجلة بعد</li>';
        }
    });

    window.blockIp = function(ipKey) {
        set(ref(db, `blocked_ips/${ipKey}`), true);
        alert("تم حظر هذا الـ IP بنجاح!");
    }
</script>

</body>
</html>
