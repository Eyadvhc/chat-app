<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق خاص - Discord Style</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5865f2">
    <style>
        :root {
            --bg-darker: #202225;
            --bg-dark: #2f3136;
            --bg-chat: #36393f;
            --text-normal: #dcddde;
            --text-muted: #72767d;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --danger-color: #ed4245;
            --success-color: #3ba55d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-chat);
            color: var(--text-normal);
        }

        #lockScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-darker);
        }
        .lock-card {
            background: var(--bg-dark);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 350px;
        }
        .lock-card h2 { margin-top: 0; color: #fff; }
        .lock-card input {
            width: 90%;
            padding: 10px;
            background: var(--bg-darker);
            border: 1px solid #202225;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .lock-card button {
            width: 100%;
            padding: 10px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .lock-card button:hover { background: var(--accent-hover); }
        .error-msg { color: var(--danger-color); margin-top: 10px; font-size: 14px; display: none; }

        #appContent {
            display: none;
            height: 100vh;
            grid-template-columns: 240px 1fr;
        }

        .sidebar {
            background-color: var(--bg-dark);
            border-left: 1px solid #202225;
            display: flex;
            flex-direction: column;
        }
        .server-header {
            padding: 20px;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            border-bottom: 2px solid var(--bg-darker);
        }
        .channel-list {
            padding: 10px;
            flex: 1;
        }
        .channel-item {
            padding: 8px 12px;
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .channel-item.active, .channel-item:hover {
            background-color: rgba(255,255,255,0.08);
            color: #fff;
        }

        .main-chat-area {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-chat);
        }

        /* قسم المكالمة الصوتية والشاشة مع لمبة التنبيه */
        .media-container {
            padding: 12px 15px;
            background-color: var(--bg-dark);
            border-bottom: 1px solid #202225;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .voice-setup {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .voice-setup input {
            padding: 6px 10px;
            background: var(--bg-darker);
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            width: 120px;
        }
        .voice-setup button {
            background-color: #4f545c;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .voice-setup button:hover { background-color: #686d73; }
        .voice-setup button.host-btn { background-color: #35a55d; }
        .voice-setup button.host-btn:hover { background-color: #2d8a4e; }
        .voice-setup button.join-btn { background-color: var(--accent-color); }
        .voice-setup button.join-btn:hover { background-color: var(--accent-hover); }
        .voice-setup button.share-btn { background-color: #e67e22; }
        .voice-setup button.share-btn:hover { background-color: #d35400; }

        /* تصميم مؤشر الإضاءة (Light Indicator) */
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }
        .light-dot {
            width: 10px;
            height: 10px;
            background-color: var(--danger-color); /* أحمر افتراضياً */
            border-radius: 50%;
            box-shadow: 0 0 5px var(--danger-color);
            transition: 0.3s;
        }
        .light-dot.connected {
            background-color: var(--success-color); /* أخضر عند الاتصال */
            box-shadow: 0 0 8px var(--success-color);
        }

        video {
            width: 200px;
            height: 120px;
            background: #000;
            border-radius: 4px;
            object-fit: cover;
            display: none;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: scroll;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            display: flex;
            flex-direction: column;
        }
        .message .username {
            font-weight: 600;
            color: #7289da;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .message .text {
            color: var(--text-normal);
            font-size: 15px;
            line-height: 1.4;
        }

        .chat-input-area {
            padding: 20px;
            background-color: var(--bg-chat);
        }
        .chat-input-wrapper {
            background-color: #40444b;
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
        }
        .chat-input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .chat-input-wrapper input::placeholder {
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-card">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="userInput" placeholder="اكتب اسمك (Username)...">
        <input type="password" id="passInput" placeholder="رمز القفل المشترك (vhc23)..." onkeypress="checkLockEnter(event)">
        <button onclick="unlockApp()">دخول</button>
        <div id="errorText" class="error-msg">الرجاء إدخال الاسم ورمز صحيح!</div>
    </div>
</div>

<div id="appContent">
    <div class="sidebar">
        <div class="server-header">VHC Private</div>
        <div class="channel-list">
            <div class="channel-item active"># عام-general</div>
        </div>
    </div>

    <div class="main-chat-area">
        <!-- قسم التحكم الصوتي مع لمبة التنبيه وأزرار Host / Join -->
        <div class="media-container">
            <div class="voice-setup">
                <input type="text" id="roomCodeInput" placeholder="رمز (6 أرقام)" maxlength="6">
                <button class="host-btn" onclick="hostVoiceChat()">إنشاء (Host)</button>
                <button class="join-btn" onclick="joinVoiceChat()">انضمام (Join)</button>
                <button class="share-btn" onclick="shareScreen()">مشاركة الشاشة</button>
                
                <!-- مؤشر الإضاءة لحالة الاتصال -->
                <div class="status-indicator">
                    <div id="lightDot" class="light-dot"></div>
                    <span id="statusText">غير متصل</span>
                </div>
            </div>
            <audio id="remoteAudio" autoplay></audio>
            <video id="screenVideo" autoplay playsinline></video>
        </div>

        <div id="chatMessages" class="chat-messages"></div>

        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <input type="text" id="msgInput" placeholder="إرسال رسالة إلى #عام-general (اضغط Enter للإرسال)..." onkeypress="checkChatEnter(event)">
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEAukk7GrRJDBC54gAjyuC9YMEMvP3E",
        authDomain: "chat-app-95202.firebaseapp.com",
        databaseURL: "https://chat-app-95202-default-rtdb.firebaseio.com",
        projectId: "chat-app-95202",
        storageBucket: "chat-app-95202.firebasestorage.app",
        messagingSenderId: "714604280805",
        appId: "1:714604280805:web:84fbc15d964d68bf954d0c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const SHARED_PASSWORD = "vhc23";
    let currentUsername = "";

    window.onload = function() {
        const savedUser = localStorage.getItem('vhc_chat_username');
        if (savedUser) {
            document.getElementById('userInput').value = savedUser;
        }
    }

    window.unlockApp = async function() {
        const enteredPass = document.getElementById('passInput').value;
        const enteredUser = document.getElementById('userInput').value.trim();
        const errorElement = document.getElementById('errorText');

        if (enteredPass === SHARED_PASSWORD && enteredUser !== "") {
            currentUsername = enteredUser;
            localStorage.setItem('vhc_chat_username', currentUsername);

            errorElement.style.display = 'none';
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('appContent').style.display = 'grid';

            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const userIp = data.ip.replaceAll('.', '_');

                const blockCheck = await get(child(ref(db), `blocked_ips/${userIp}`));
                if (blockCheck.exists()) {
                    alert("عذراً، هذا الجهاز محظور من قبل المسؤول!");
                    document.getElementById('appContent').style.display = 'none';
                    document.getElementById('lockScreen').style.display = 'flex';
                    return;
                }

                set(ref(db, `connected_users/${userIp}`), {
                    ip: data.ip,
                    username: currentUsername,
                    lastActive: Date.now()
                });
            } catch(e) {
                console.log("العمل محلياً دون تتبع IP");
            }
        } else {
            errorElement.style.display = 'block';
            document.getElementById('passInput').value = '';
        }
    }

    window.checkLockEnter = function(e) {
        if (e.key === 'Enter') {
            unlockApp();
        }
    }

    window.sendTextMessage = function() {
        const text = document.getElementById('msgInput').value;
        if(text.trim() !== '') {
            push(ref(db, 'messages/'), { 
                text: text, 
                sender: currentUsername, 
                timestamp: Date.now() 
            });
            document.getElementById('msgInput').value = '';
        }
    }

    window.checkChatEnter = function(e) {
        if (e.key === 'Enter') {
            sendTextMessage();
        }
    }

    onChildAdded(ref(db, 'messages/'), (data) => {
        const msg = data.val();
        const box = document.getElementById('chatMessages');
        box.innerHTML += `
            <div class="message">
                <div class="username">${msg.sender}</div>
                <div class="text">${msg.text}</div>
            </div>
        `;
        box.scrollTop = box.scrollHeight;
    });

    // دالة لتغيير لون لمبة التنبيه عند نجاح أو قطع الاتصال
    function updateConnectionStatus(isConnected) {
        const dot = document.getElementById('lightDot');
        const text = document.getElementById('statusText');
        if (isConnected) {
            dot.classList.add('connected');
            text.innerText = "متصل صوتياً";
        } else {
            dot.classList.remove('connected');
            text.innerText = "غير متصل";
        }
    }

    let localStream, peerConnection;
    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    // 1. الطرف الأول: إنشاء الغرفة (Host)
    window.hostVoiceChat = async function() {
        const roomCode = document.getElementById('roomCodeInput').value.trim();
        if (roomCode.length !== 6) {
            alert("الرجاء إدخال رمز مكون من 6 أرقام لإنشاء الغرفة!");
            return;
        }

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            peerConnection = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                updateConnectionStatus(true);
                if (event.streams[0].getVideoTracks().length > 0) {
                    const screenVideo = document.getElementById('screenVideo');
                    screenVideo.srcObject = event.streams[0];
                    screenVideo.style.display = 'block';
                } else {
                    document.getElementById('remoteAudio').srcObject = event.streams[0];
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    push(ref(db, `voice_rooms/${roomCode}/host_candidates`), JSON.stringify(event.candidate));
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            set(ref(db, `voice_rooms/${roomCode}/offer`), { sdp: offer.sdp, type: offer.type });

            // الاستماع لرد (Answer) الطرف الثاني والانضمام
            onChildAdded(ref(db, `voice_rooms/${roomCode}/answer`), async (snapshot) => {
                const answer = snapshot.val();
                if (answer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                    updateConnectionStatus(true);
                }
            });

            // استقبال مرشحي الاتصال (Candidates) من العميل
            onChildAdded(ref(db, `voice_rooms/${roomCode}/join_candidates`), async (snapshot) => {
                const candidateData = snapshot.val();
                if (candidateData && peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(JSON.parse(candidateData)));
                }
            });

            alert("تم إنشاء الغرفة (Host) بنجاح. في انتظار انضمام الطرف الآخر...");
        } catch (err) {
            alert("خطأ في الميكروفون: " + err);
        }
    };

    // 2. الطرف الثاني: الانضمام للغرفة (Join)
    window.joinVoiceChat = async function() {
        const roomCode = document.getElementById('roomCodeInput').value.trim();
        if (roomCode.length !== 6) {
            alert("الرجاء إدخال الرمز المكون من 6 أرقام للانضمام!");
            return;
        }

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            peerConnection = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                updateConnectionStatus(true);
                if (event.streams[0].getVideoTracks().length > 0) {
                    const screenVideo = document.getElementById('screenVideo');
                    screenVideo.srcObject = event.streams[0];
                    screenVideo.style.display = 'block';
                } else {
                    document.getElementById('remoteAudio').srcObject = event.streams[0];
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    push(ref(db, `voice_rooms/${roomCode}/join_candidates`), JSON.stringify(event.candidate));
                }
            };

            // جلب الـ Offer الخاص بالغرفة
            const offerSnap = await get(child(ref(db), `voice_rooms/${roomCode}/offer`));
            if (!offerSnap.exists()) {
                alert("لم يتم العثور على غرفة بهذا الرمز! تأكد من أن الـ Host قام بإنشائها أولاً.");
                return;
            }

            const offer = offerSnap.val();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            set(ref(db, `voice_rooms/${roomCode}/answer`), { sdp: answer.sdp, type: answer.type });

            // استقبال مرشحي الاتصال من الـ Host
            onChildAdded(ref(db, `voice_rooms/${roomCode}/host_candidates`), async (snapshot) => {
                const candidateData = snapshot.val();
                if (candidateData && peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(JSON.parse(candidateData)));
                }
            });

            updateConnectionStatus(true);
            alert("تم الانضمام للاتصال الصوتي بنجاح!");
        } catch (err) {
            alert("خطأ في الانضمام للمكالمة: " + err);
        }
    };

    window.shareScreen = async function() {
        try {
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            const screenTrack = screenStream.getVideoTracks()[0];
            
            const screenVideo = document.getElementById('screenVideo');
            screenVideo.srcObject = screenStream;
            screenVideo.style.display = 'block';

            if (peerConnection) {
                const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) {
                    sender.replaceTrack(screenTrack);
                } else {
                    screenStream.getTracks().forEach(track => peerConnection.addTrack(track, screenStream));
                }
            }

            screenTrack.onended = () => {
                screenVideo.style.display = 'none';
            };
        } catch (err) {
            console.log("تم إلغاء مشاركة الشاشة");
        }
    };
</script>

</body>
</html>
