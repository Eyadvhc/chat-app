<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تطبيق خاص - Discord Style</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#5865f2">
    <style>
        :root {
            --bg-darker: #202225;
            --bg-dark: #2f3136;
            --bg-chat: #36393f;
            --text-normal: #dcddde;
            --text-muted: #72767d;
            --accent-color: #5865f2;
            --accent-hover: #4752c4;
            --danger-color: #ed4245;
            --success-color: #3ba55d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-chat);
            color: var(--text-normal);
        }

        #lockScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: var(--bg-darker);
        }
        .lock-card {
            background: var(--bg-dark);
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            width: 350px;
        }
        .lock-card h2 { margin-top: 0; color: #fff; }
        .lock-card input {
            width: 90%;
            padding: 10px;
            background: var(--bg-darker);
            border: 1px solid #202225;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .lock-card button {
            width: 100%;
            padding: 10px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
        .lock-card button:hover { background: var(--accent-hover); }
        .error-msg { color: var(--danger-color); margin-top: 10px; font-size: 14px; display: none; }

        #appContent {
            display: none;
            height: 100vh;
            grid-template-columns: 240px 1fr;
        }

        .sidebar {
            background-color: var(--bg-dark);
            border-left: 1px solid #202225;
            display: flex;
            flex-direction: column;
        }
        .server-header {
            padding: 20px;
            font-weight: bold;
            font-size: 16px;
            color: #fff;
            border-bottom: 2px solid var(--bg-darker);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .clear-chat-btn {
            background: var(--danger-color);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .clear-chat-btn:hover { background: #c0392b; }

        .channel-list {
            padding: 10px;
            flex: 1;
        }
        .channel-item {
            padding: 8px 12px;
            border-radius: 4px;
            color: var(--text-muted);
            cursor: pointer;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .channel-item.active, .channel-item:hover {
            background-color: rgba(255,255,255,0.08);
            color: #fff;
        }

        .main-chat-area {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: var(--bg-chat);
        }

        .media-container {
            padding: 12px 15px;
            background-color: var(--bg-dark);
            border-bottom: 1px solid #202225;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .voice-setup {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .voice-setup input {
            padding: 6px 10px;
            background: var(--bg-darker);
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            width: 120px;
        }
        .voice-setup button {
            background-color: #4f545c;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
        }
        .voice-setup button:hover { background-color: #686d73; }
        .voice-setup button.host-btn { background-color: #35a55d; }
        .voice-setup button.host-btn:hover { background-color: #2d8a4e; }
        .voice-setup button.join-btn { background-color: var(--accent-color); }
        .voice-setup button.join-btn:hover { background-color: var(--accent-hover); }
        .voice-setup button.share-btn { background-color: #e67e22; display: none; }
        .voice-setup button.share-btn:hover { background-color: #d35400; }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
        }
        .light-dot {
            width: 10px;
            height: 10px;
            background-color: var(--danger-color);
            border-radius: 50%;
            box-shadow: 0 0 5px var(--danger-color);
            transition: 0.3s;
        }
        .light-dot.connected {
            background-color: var(--success-color);
            box-shadow: 0 0 8px var(--success-color);
        }

        video {
            width: 200px;
            height: 120px;
            background: #000;
            border-radius: 4px;
            object-fit: cover;
            display: none;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: scroll;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            display: flex;
            flex-direction: column;
            position: relative;
            padding-right: 5px;
        }
        .message-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .message .username {
            font-weight: 600;
            color: #7289da;
            font-size: 14px;
        }
        .delete-msg-btn {
            background: transparent;
            border: none;
            color: var(--danger-color);
            cursor: pointer;
            font-size: 12px;
            display: none;
        }
        .message:hover .delete-msg-btn {
            display: inline-block;
        }
        .message .text {
            color: var(--text-normal);
            font-size: 15px;
            line-height: 1.4;
            margin-top: 2px;
        }
        .message-info {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .chat-input-area {
            padding: 20px;
            background-color: var(--bg-chat);
        }
        .chat-input-wrapper {
            background-color: #40444b;
            border-radius: 8px;
            padding: 10px 15px;
            display: flex;
            align-items: center;
        }
        .chat-input-wrapper input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .chat-input-wrapper input::placeholder {
            color: var(--text-muted);
        }

        /* لوحة تحكم الأدمن (Admin Panel Modal) */
        #adminModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .admin-content {
            background: var(--bg-dark);
            padding: 25px;
            border-radius: 8px;
            width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            color: #fff;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .admin-table th, .admin-table td {
            border: 1px solid #444;
            padding: 8px;
            text-align: center;
            font-size: 14px;
        }
        .admin-action-btn {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            color: white;
        }
        .btn-block { background: var(--danger-color); }
        .btn-delete { background: #c0392b; }
    </style>
</head>
<body>

<div id="lockScreen">
    <div class="lock-card">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="userInput" placeholder="اكتب اسمك (Username)...">
        <input type="password" id="passInput" placeholder="رمز القفل المشترك (vhc23)..." onkeypress="checkLockEnter(event)">
        
        <button onclick="checkUserAndProceed()">دخول / إنشاء حساب</button>
        <div id="errorText" class="error-msg">الرجاء إدخال الاسم ورمز صحيح!</div>
    </div>
</div>

<!-- لوحة تحكم الأدمن (تظهر فقط للأدمن) -->
<div id="adminModal">
    <div class="admin-content">
        <h3>لوحة تحكم الأدمن (إدارة المستخدمين و الـ IPs)</h3>
        <p style="font-size: 12px; color: var(--text-muted);">يمكنك حظر أو حذف المستخدمين والأجهزة المتصلة هنا:</p>
        <table class="admin-table">
            <thead>
                <tr>
                    <th>الاسم</th>
                    <th>IP الجهاز</th>
                    <th>الإجراءات</th>
                </tr>
            </thead>
            <tbody id="adminUsersList">
                <!-- سيتم تعبئتها ديناميكياً -->
            </tbody>
        </table>
        <br>
        <button onclick="closeAdminPanel()" style="background: #4f545c; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">إغلاق لوحة الأدمن</button>
    </div>
</div>

<div id="appContent">
    <div class="sidebar">
        <div class="server-header">
            <span>VHC Private</span>
            <button class="clear-chat-btn" onclick="clearAllChat()" title="مسح كل الشات">مسح الكل</button>
        </div>
        <div class="channel-list">
            <div class="channel-item active"># عام-general</div>
        </div>
    </div>

    <div class="main-chat-area">
        <div class="media-container">
            <div class="voice-setup">
                <input type="text" id="roomCodeInput" placeholder="رمز (6 أرقام)" maxlength="6">
                <button class="host-btn" onclick="hostVoiceChat()">إنشاء (Host)</button>
                <button class="join-btn" onclick="joinVoiceChat()">انضمام (Join)</button>
                <button id="shareScreenBtn" class="share-btn" onclick="shareScreen()">مشاركة الشاشة</button>
                
                <div class="status-indicator">
                    <div id="lightDot" class="light-dot"></div>
                    <span id="statusText">غير متصل</span>
                </div>
            </div>
            <audio id="remoteAudio" autoplay></audio>
            <video id="screenVideo" autoplay playsinline></video>
        </div>

        <div id="chatMessages" class="chat-messages"></div>

        <div class="chat-input-area">
            <div class="chat-input-wrapper">
                <input type="text" id="msgInput" placeholder="إرسال رسالة إلى #عام-general (اضغط Enter للإرسال)..." onkeypress="checkChatEnter(event)">
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onChildAdded, onChildRemoved, set, get, remove, child, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDEAukk7GrRJDBC54gAjyuC9YMEMvP3E",
        authDomain: "chat-app-95202.firebaseapp.com",
        databaseURL: "https://chat-app-95202-default-rtdb.firebaseio.com",
        projectId: "chat-app-95202",
        storageBucket: "chat-app-95202.firebasestorage.app",
        messagingSenderId: "714604280805",
        appId: "1:714604280805:web:84fbc15d964d68bf954d0c"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    const SHARED_PASSWORD = "vhc23";
    let currentUsername = "";
    let currentUserIpKey = "";

    window.onload = function() {
        const savedUser = localStorage.getItem('vhc_chat_username');
        if (savedUser) {
            document.getElementById('userInput').value = savedUser;
        }
    }

    // فحص ما إذا كان المستخدم مسجلاً من قبل أو جديداً
    window.checkUserAndProceed = async function() {
        const enteredUser = document.getElementById('userInput').value.trim();
        const enteredPass = document.getElementById('passInput').value;
        const errorElement = document.getElementById('errorText');

        if (enteredUser === "" || enteredPass !== SHARED_PASSWORD) {
            errorElement.style.display = 'block';
            document.getElementById('passInput').value = '';
            return;
        }
        errorElement.style.display = 'none';

        try {
            const usersSnap = await get(child(ref(db), 'connected_users'));
            let nameExistsInDb = false;

            if (usersSnap.exists()) {
                usersSnap.forEach((childSnap) => {
                    const userData = childSnap.val();
                    if (userData.username && userData.username.toLowerCase() === enteredUser.toLowerCase()) {
                        nameExistsInDb = true;
                    }
                });
            }

            // إذا كان الاسم مسجلاً بالفعل في قاعدة البيانات، ادخل مباشرة دون رسالة تأكيد
            if (nameExistsInDb) {
                unlockApp(enteredUser);
            } else {
                // إذا كان اسماً جديداً كلياً، أظهر رسالة التأكيد لمنع الإنشاء بالخطأ
                if (confirm(`هل أنت متأكد من رغبتك في إنشاء مستخدم جديد باسم: (${enteredUser})؟`)) {
                    unlockApp(enteredUser);
                }
            }

        } catch (e) {
            console.log("خطأ أثناء فحص اسم المستخدم:", e);
            // في حال حدوث مشكلة اتصال، اعتبره مستخدماً جديداً وأظهر رسالة التأكيد احتياطياً
            if (confirm(`هل أنت متأكد من رغبتك في الدخول بالاسم: (${enteredUser})؟`)) {
                unlockApp(enteredUser);
            }
        }
    }

    window.unlockApp = async function(enteredUser) {
        currentUsername = enteredUser;
        localStorage.setItem('vhc_chat_username', currentUsername);

        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            currentUserIpKey = data.ip.replaceAll('.', '_');

            // فحص هل الـ IP محظور أم لا
            const blockCheck = await get(child(ref(db), `blocked_ips/${currentUserIpKey}`));
            if (blockCheck.exists()) {
                alert("عذراً، هذا الـ IP تم حظره من قبل الأدمن!");
                return;
            }

            // تسجيل الجهاز في قاعدة البيانات
            set(ref(db, `connected_users/${currentUserIpKey}`), {
                ip: data.ip,
                username: currentUsername,
                lastActive: Date.now()
            });
        } catch(e) {
            currentUserIpKey = "local_device";
            console.log("العمل محلياً دون تتبع IP");
        }

        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('appContent').style.display = 'grid';

        // إذا كان اسم المستخدم هو Admin، افتح لوحة التحكم تلقائياً
        if (currentUsername.toLowerCase() === 'admin') {
            openAdminPanel();
        }

        listenToAdminActions();
    }

    window.checkLockEnter = function(e) {
        if (e.key === 'Enter') {
            checkUserAndProceed();
        }
    }

    // فتح وإغلاق لوحة الأدمن
    function openAdminPanel() {
        document.getElementById('adminModal').style.display = 'flex';
        loadAdminData();
    }

    window.closeAdminPanel = function() {
        document.getElementById('adminModal').style.display = 'none';
    }

    // تحميل وتحديث بيانات المستخدمين للأدمن
    function loadAdminData() {
        const usersListRef = ref(db, 'connected_users');
        onValue(usersListRef, (snapshot) => {
            const tbody = document.getElementById('adminUsersList');
            tbody.innerHTML = '';
            
            if (snapshot.exists()) {
                snapshot.forEach((childSnap) => {
                    const userData = childSnap.val();
                    const ipKey = childSnap.key;

                    tbody.innerHTML += `
                        <tr>
                            <td>${userData.username}</td>
                            <td>${userData.ip || 'محلية'}</td>
                            <td>
                                <button class="admin-action-btn btn-block" onclick="blockIp('${ipKey}')">حظر IP</button>
                                <button class="admin-action-btn btn-delete" onclick="deleteUser('${ipKey}')">حذف</button>
                            </td>
                        </tr>
                    `;
                });
            }
        });
    }

    // وظيفة حظر IP للأدمن
    window.blockIp = async function(ipKey) {
        if (confirm("هل أنت متأكد من حظر هذا الجهاز (IP)؟")) {
            await set(ref(db, `blocked_ips/${ipKey}`), true);
            await remove(ref(db, `connected_users/${ipKey}`));
            alert("تم الحظر بنجاح!");
        }
    }

    // وظيفة حذف المستخدم من القائمة النشطة
    window.deleteUser = async function(ipKey) {
        if (confirm("هل أنت متأكد من حذف هذا المستخدم؟")) {
            await remove(ref(db, `connected_users/${ipKey}`));
        }
    }

    // الاستماع لو تم حظر المستخدم الحالي أثناء تواجده لتسجيل خروجه فوراً
    function listenToAdminActions() {
        if (!currentUserIpKey) return;
        onValue(ref(db, `blocked_ips/${currentUserIpKey}`), (snapshot) => {
            if (snapshot.exists()) {
                alert("تم حظرك من قبل الأدمن!");
                location.reload();
            }
        });
    }

    window.sendTextMessage = function() {
        const text = document.getElementById('msgInput').value;
        if(text.trim() !== '') {
            const newMsgRef = push(ref(db, 'messages/'));
            set(newMsgRef, {
                id: newMsgRef.key,
                text: text,
                sender: currentUsername,
                status: 'Sent (تم الإرسال للسيرفر)',
                timestamp: Date.now()
            }).then(() => {
                setTimeout(() => {
                    set(ref(db, `messages/${newMsgRef.key}/status`), 'Delivered (وصلت للطرف الآخر 📬)');
                }, 500);
            });

            document.getElementById('msgInput').value = '';
        }
    }

    window.checkChatEnter = function(e) {
        if (e.key === 'Enter') {
            sendTextMessage();
        }
    }

    window.deleteMessage = function(msgId) {
        remove(ref(db, `messages/${msgId}`));
    }

    window.clearAllChat = function() {
        if(confirm("هل أنت متأكد من مسح جميع الرسائل؟")) {
            remove(ref(db, 'messages/'));
            document.getElementById('chatMessages').innerHTML = '';
        }
    }

    onChildAdded(ref(db, 'messages/'), (data) => {
        const msg = data.val();
        if (!msg) return;

        const box = document.getElementById('chatMessages');
        
        if (msg.sender !== currentUsername && msg.status !== 'Seen (شاهدها الطرف الآخر 👀)') {
            set(ref(db, `messages/${msg.id}/status`), 'Seen (شاهدها الطرف الآخر 👀)');
        }

        const msgDiv = document.createElement('div');
        msgDiv.className = 'message';
        msgDiv.id = `msg-${msg.id}`;
        msgDiv.innerHTML = `
            <div class="message-header">
                <span class="username">${msg.sender}</span>
                ${msg.sender === currentUsername ? `<button class="delete-msg-btn" onclick="deleteMessage('${msg.id}')">حذف</button>` : ''}
            </div>
            <div class="text">${msg.text}</div>
            <div class="message-info" id="status-${msg.id}">${msg.status || 'Sent'}</div>
        `;
        box.appendChild(msgDiv);
        box.scrollTop = box.scrollHeight;
    });

    onChildRemoved(ref(db, 'messages/'), (data) => {
        const msgId = data.key;
        const msgElement = document.getElementById(`msg-${msgId}`);
        if (msgElement) {
            msgElement.remove();
        }
    });

    import("https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js").then(({ onChildChanged }) => {
        onChildChanged(ref(db, 'messages/'), (data) => {
            const msg = data.val();
            const statusEl = document.getElementById(`status-${msg.id}`);
            if (statusEl) {
                statusEl.innerText = msg.status;
            }
        });
    });

    function updateConnectionStatus(isConnected) {
        const dot = document.getElementById('lightDot');
        const text = document.getElementById('statusText');
        const shareBtn = document.getElementById('shareScreenBtn');

        if (isConnected) {
            dot.classList.add('connected');
            text.innerText = "متصل صوتياً";
            shareBtn.style.display = 'inline-block';
        } else {
            dot.classList.remove('connected');
            text.innerText = "غير متصل";
            shareBtn.style.display = 'none';
        }
    }

    let localStream, peerConnection;
    const servers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    window.hostVoiceChat = async function() {
        const roomCode = document.getElementById('roomCodeInput').value.trim();
        if (roomCode.length !== 6) {
            alert("الرجاء إدخال رمز مكون من 6 أرقام لإنشاء الغرفة!");
            return;
        }

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            peerConnection = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                updateConnectionStatus(true);
                if (event.streams[0].getVideoTracks().length > 0) {
                    const screenVideo = document.getElementById('screenVideo');
                    screenVideo.srcObject = event.streams[0];
                    screenVideo.style.display = 'block';
                } else {
                    document.getElementById('remoteAudio').srcObject = event.streams[0];
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    push(ref(db, `voice_rooms/${roomCode}/host_candidates`), JSON.stringify(event.candidate));
                }
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            set(ref(db, `voice_rooms/${roomCode}/offer`), { sdp: offer.sdp, type: offer.type });

            onChildAdded(ref(db, `voice_rooms/${roomCode}/answer`), async (snapshot) => {
                const answer = snapshot.val();
                if (answer && !peerConnection.currentRemoteDescription) {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
                    updateConnectionStatus(true);
                }
            });

            onChildAdded(ref(db, `voice_rooms/${roomCode}/join_candidates`), async (snapshot) => {
                const candidateData = snapshot.val();
                if (candidateData && peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(JSON.parse(candidateData)));
                }
            });

            alert("تم إنشاء الغرفة (Host) بنجاح. في انتظار انضمام الطرف الآخر...");
        } catch (err) {
            alert("خطأ في الميكروفون: " + err);
        }
    };

    window.joinVoiceChat = async function() {
        const roomCode = document.getElementById('roomCodeInput').value.trim();
        if (roomCode.length !== 6) {
            alert("الرمز المكون من 6 أرقام مطلوب للانضمام!");
            return;
        }

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            peerConnection = new RTCPeerConnection(servers);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (event) => {
                updateConnectionStatus(true);
                if (event.streams[0].getVideoTracks().length > 0) {
                    const screenVideo = document.getElementById('screenVideo');
                    screenVideo.srcObject = event.streams[0];
                    screenVideo.style.display = 'block';
                } else {
                    document.getElementById('remoteAudio').srcObject = event.streams[0];
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    push(ref(db, `voice_rooms/${roomCode}/join_candidates`), JSON.stringify(event.candidate));
                }
            };

            const offerSnap = await get(child(ref(db), `voice_rooms/${roomCode}/offer`));
            if (!offerSnap.exists()) {
                alert("لم يتم العثور على غرفة بهذا الرمز!");
                return;
            }

            const offer = offerSnap.val();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));

            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            set(ref(db, `voice_rooms/${roomCode}/answer`), { sdp: answer.sdp, type: answer.type });

            onChildAdded(ref(db, `voice_rooms/${roomCode}/host_candidates`), async (snapshot) => {
                const candidateData = snapshot.val();
                if (candidateData && peerConnection) {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(JSON.parse(candidateData)));
                }
            });

            updateConnectionStatus(true);
            alert("تم الانضمام للاتصال الصوتي بنجاح!");
        } catch (err) {
            alert("خطأ في الانضمام للمكالمة: " + err);
        }
    };

    window.shareScreen = async function() {
        try {
            const screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            const screenTrack = screenStream.getVideoTracks()[0];
            
            const screenVideo = document.getElementById('screenVideo');
            screenVideo.srcObject = screenStream;
            screenVideo.style.display = 'block';

            if (peerConnection) {
                const sender = peerConnection.getSenders().find(s => s.track && s.track.kind === 'video');
                if (sender) {
                    sender.replaceTrack(screenTrack);
                } else {
                    screenStream.getTracks().forEach(track => peerConnection.addTrack(track, screenStream));
                }
            }

            screenTrack.onended = () => {
                screenVideo.style.display = 'none';
            };
        } catch (err) {
            console.log("تم إلغاء مشاركة الشاشة");
        }
    };
</script>
